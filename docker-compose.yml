version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: livepolling-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - polling-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: livepolling-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - polling-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: livepolling-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB_NAME=livepolling
      - REDIS_URL=redis:6379
      - REDIS_PASSWORD=
      - JWT_SECRET=guvi_live_polling_jwt_secret_key_production_2026
      - CLIENT_ORIGIN=*
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - polling-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: livepolling-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - polling-network

networks:
  polling-network:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
